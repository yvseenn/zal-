<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">ZALØ favicon logo</title>
  <desc id="desc">A dark purple rounded-square favicon with a white stylized Ø symbol inspired by the ZALØ wordmark.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#24104a"/>
      <stop offset="100%" stop-color="#090312"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)"/>
  <circle cx="32" cy="32" r="17" fill="none" stroke="#F2EEFF" stroke-width="6"/>
  <line x1="42.5" y1="14.5" x2="21.5" y2="49.5" stroke="#F2EEFF" stroke-width="6" stroke-linecap="square"/>
</svg>
